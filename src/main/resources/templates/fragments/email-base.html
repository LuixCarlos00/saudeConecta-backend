<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <!--
        Estilo único de todos os e-mails do DocClin.
        Paleta propositalmente neutra: só UMA cor de destaque (azul #1d4ed8, o primary-dark do front)
        e o resto em tons de cinza. Avisos não usam amarelo/vermelho; são diferenciados pela borda lateral.
        Antes, cada template tinha seu CSS (gradiente, amarelo, cor por perfil) e os e-mails ficavam desiguais.
    -->
    <style th:fragment="estilo">
        body {
            margin: 0;
            padding: 24px 12px;
            background-color: #f4f5f7;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            line-height: 1.6;
            color: #1f2937;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
        .header {
            padding: 24px 32px 16px;
            border-bottom: 1px solid #e5e7eb;
        }
        .marca {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            color: #1d4ed8;
        }
        .subtitulo {
            margin: 4px 0 0;
            font-size: 14px;
            color: #6b7280;
        }
        .content {
            padding: 24px 32px;
        }
        .content h2 {
            margin: 0 0 16px;
            font-size: 18px;
            color: #111827;
        }
        .destaque {
            margin: 20px 0;
            padding: 16px 20px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-left: 3px solid #1d4ed8;
            border-radius: 4px;
        }
        .destaque-centro {
            text-align: center;
        }
        .item {
            margin: 6px 0;
        }
        .rotulo {
            font-weight: bold;
            color: #4b5563;
        }
        .valor {
            font-size: 17px;
            font-weight: bold;
            color: #111827;
        }
        .aviso {
            margin: 20px 0;
            padding: 14px 18px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-left: 3px solid #9ca3af;
            border-radius: 4px;
            font-size: 14px;
            color: #374151;
        }
        .aviso p, .aviso ul {
            margin: 8px 0 0;
        }
        .aviso ul {
            padding-left: 20px;
        }
        .acao {
            margin: 24px 0;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 12px 28px;
            background-color: #1d4ed8;
            color: #ffffff !important;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
        }
        .link-texto {
            word-break: break-all;
            color: #1d4ed8;
        }
        a {
            color: #1d4ed8;
        }
        .footer {
            padding: 16px 32px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
        .footer p {
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div th:fragment="rodape" class="footer">
        <p>Este é um e-mail automático. Por favor, não responda.</p>
        <p>© DocClin - Todos os direitos reservados</p>
    </div>
</body>
</html>
